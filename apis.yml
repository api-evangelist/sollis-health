- aid: sollis-health:navigator-api
  name: Sollis Health Navigator API
  description: 'First-party backend API for the Sollis Health Navigator Dashboard
    (navigator.sollishealth.com), the internal clinical and care-coordination console used
    by Sollis staff. Exposes versioned resource paths (observed: /v1/regions, /v1/departments,
    /v1/GetGroups) and a SignalR real-time hub at /activity/hubs/activity. Authentication is
    Microsoft identity (MSAL); an unauthenticated GET on /v1/regions returns 401. No OpenAPI,
    Swagger or GraphQL contract is published at any probed location.'
  humanURL: https://navigator.sollishealth.com/
  baseURL: https://navigator-api.sollishealth.com
  tags:
  - Clinical
  - Internal
  - Care Coordination
  x-access: private
  x-access-note: Staff-only console API; unauthenticated requests return 401. No public specification.
  x-evidence:
