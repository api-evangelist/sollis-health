aid: sollis-health
name: Sollis Health
description: 'Sollis Health is a members-only concierge medicine and 24/7 private
  emergency care company operating staffed medical centers in New York and the Hamptons,
  Southern and Northern California, and South Florida. Membership provides unlimited
  access to emergency-trained physicians, on-site imaging and laboratory diagnostics,
  house calls, virtual visits, travel medicine, specialist coordination, care navigation
  and patient advocacy. Sollis is a membership service rather than insurance, and it
  complements rather than replaces a member''s existing clinicians. Individual, family,
  pediatric and corporate memberships are sold, along with a Platinum tier and bespoke
  employer plans. Sollis operates its own member-facing software — a Member Portal and
  an internal Navigator clinical dashboard — backed by first-party APIs secured with
  Microsoft Entra External ID (Azure AD B2C); those APIs are not published as a public
  developer program.'
