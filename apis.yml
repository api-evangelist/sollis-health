apis:
- aid: sollis-health:member-portal-api
  name: Sollis Health Member Portal API
  description: 'First-party backend API for the Sollis Health Member Portal (mp.sollishealth.com),
    the members-only web application used to book appointments, view records and manage
    membership. Authentication is Microsoft Entra External ID (Azure AD B2C) under the
    sollishealthprod tenant, with an application scope of Appointment.All. The host is
    live and returns a JSON 404 envelope on unknown paths; no OpenAPI, Swagger, GraphQL
    or other machine-readable contract is published at any probed location. This is an
    internal product API, not a public developer program.'
  humanURL: https://mp.sollishealth.com/
  baseURL: https://mp-api.sollishealth.com
  tags:
  - Members
  - Appointments
  - Portal
  x-access: private
  x-access-note: Auth-gated behind Azure AD B2C; no public specification or reference published.
  x-evidence:
    fetched: '2026-08-05'
    discovered_in: https://mp.sollishealth.com/static/js/main.bee280e8.js
    probes:
    - url: https://mp-api.sollishealth.com/
      status: 404
    - url: https://mp-api.sollishealth.com/swagger/v1/swagger.json
      status: 404
    - url: https://mp-api.sollishealth.com/openapi.json
      status: 404
